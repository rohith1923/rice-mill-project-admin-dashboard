<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rice Mill Monitor - Admin Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-main: #f3f5f3;
      --bg-card: #ffffff;
      --primary-green: #0d6535;
      --light-green: #e2f4e8;
      --medium-green: #b8dfc6;
      --border-color: #e1e6e1;
      --text-dark: #111827;
      --text-muted: #6b7280;
      --text-secondary: #374151;
      --red-alert: #d9383a;
      --red-light: #fef2f2;
      --yellow-alert: #d97706;
      --yellow-light: #fffbeb;
      --blue-info: #2563eb;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-pill: 20px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ===================== SIDEBAR ===================== */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
      overflow-y: auto;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      padding: 4px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--primary-green);
      border-radius: 10px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-text strong {
      display: block;
      font-size: 15px;
      color: var(--text-dark);
    }

    .brand-text span {
      font-size: 11px;
      color: var(--text-muted);
    }

    .nav-section-title {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin: 20px 0 8px 14px;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background-color: #f0f5f0;
      color: var(--text-dark);
    }

    .nav-item.active {
      background-color: var(--light-green);
      color: var(--primary-green);
      font-weight: 600;
    }

    .nav-item .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }

    .sidebar-footer {
      padding: 16px 8px 0;
      border-top: 1px solid var(--border-color);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: var(--light-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--primary-green);
      font-size: 13px;
    }

    .logout-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      width: 100%;
      justify-content: center;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: var(--red-light);
      color: var(--red-alert);
      border-color: var(--red-alert);
    }

    /* ===================== MAIN ===================== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      height: 60px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-card);
      flex-shrink: 0;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .top-bar-date {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .top-bar-page {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .plant-selector {
      background: var(--light-green);
      color: var(--primary-green);
      padding: 7px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .plant-selector:hover {
      background: var(--medium-green);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--primary-green);
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--primary-green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .content {
      padding: 28px 32px;
      overflow-y: auto;
      flex: 1;
    }

    /* ===================== CARDS ===================== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    /* ===================== PAGE HEADER ===================== */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .page-header h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .page-header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ===================== BUTTONS ===================== */
    .btn-primary {
      background: var(--primary-green);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background: #0a5229;
      box-shadow: var(--shadow-md);
    }
